[build-system]
# Specifies the tools required to build the package
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itc_fit"
version = "0.1.0"
description = "A custom fork optimized for notebooks"
readme = "README.md"
requires-python = ">=3.7"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Define external package dependencies required for runtime (replacing install_requires)
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.11.0",
    # Add other runtime requirements here
]

[tool.setuptools]
# Tells setuptools to automatically discover your package directories
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }
